name: Push to Notion

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_file:
        description: "테스트용 파일 경로 1개 (예: SWEA/DP/4008-특이한사칙연산/sol.py). 비우면 아무 동작 안 함."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  register-to-notion:
    runs-on: ubuntu-latest
    environment: Notion
    steps:
      - name: 레포 체크아웃 (변경 비교를 위해 전체 히스토리 필요)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 변경된 파일 목록 계산
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES="${{ github.event.inputs.test_file }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # 첫 push인 경우 빈 트리와 비교
              FILES=$(git -c core.quotePath=false diff --name-only --diff-filter=ACM $(git hash-object -t tree /dev/null) "$AFTER")
            else
              FILES=$(git -c core.quotePath=false diff --name-only --diff-filter=ACM "$BEFORE" "$AFTER")
            fi
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # push 이벤트에는 커밋 시각이 있지만, 수동 실행(workflow_dispatch)에는 없으므로
          # 그 경우 현재 시각으로 대체
          COMMIT_DATE="${{ github.event.head_commit.timestamp }}"
          if [ -z "$COMMIT_DATE" ]; then
            COMMIT_DATE=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')
          fi
          echo "commit_date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"

      - name: (디버그용) 토큰 길이 확인
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          echo "NOTION_TOKEN 길이: ${#NOTION_TOKEN}"
          echo "DATABASE_ID 길이: ${#DATABASE_ID}"
          echo "NOTION_TOKEN 앞 4글자: ${NOTION_TOKEN:0:4}"

      - name: Notion에 등록
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_DATE: ${{ steps.diff.outputs.commit_date }}
          REPO_URL: https://github.com/${{ github.repository }}/blob/main
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: python scripts/github_to_notion.py
